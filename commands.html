<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>أوامر Valk</title><link rel="icon" href="assets/logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=2.15"></head>
<body data-page="commands"><header id="nav"></header>
<main><div class="wrap" style="padding-top:40px;padding-bottom:50px">
  <div class="sec-h"><small>الأوامر</small><h2>كل أوامر Valk</h2><p>اكتب الأمر نفسه بالكروب. الأوامر اللي تبدأ بـ / تشتغل بالسلاش أو بدونها حسب إعداد الكروب.</p></div>
  <input class="search" id="q" type="search" placeholder="ابحث عن أمر (مثال: اونو، كتم، راتب)" autocomplete="off">
  <div class="tabs" id="tabs"></div>
  <div class="cmdbox" id="list"></div>
</div></main>
<footer id="foot"></footer>
<script src="js/config.js?v=2.15"></script><script src="js/data.js?v=2.15"></script><script src="js/app.js?v=2.15"></script>
<script>
(function(){
  var C=window.VALK_COMMANDS, cats=["الكل"].concat(C.map(function(c){return c.cat;}).filter(function(c,i,a){return a.indexOf(c)===i;}));
  var cur="الكل",q=document.getElementById("q"),tabs=document.getElementById("tabs"),list=document.getElementById("list");
  function norm(s){return s.replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").toLowerCase();}
  function draw(){
    tabs.innerHTML=cats.map(function(c){return '<button class="tab '+(c===cur?'on':'')+'" data-c="'+c+'">'+c+'</button>';}).join("");
    var term=norm(q.value.trim());
    var rows=C.filter(function(c){return (cur==="الكل"||c.cat===cur)&&(!term||norm(c.cmd+" "+c.desc).indexOf(term)>-1);});
    list.innerHTML=rows.length?rows.map(function(c){return '<div class="cmd"><code>'+c.cmd+'</code><span>'+c.desc+'</span></div>';}).join(""):'<div class="empty">ما لقيت أمر بهالاسم.</div>';
    tabs.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){cur=b.dataset.c;draw();};});
  }
  q.oninput=draw;draw();
})();
</script></body></html>
