<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تحديثات Valk</title><link rel="icon" href="assets/logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=2.14"></head>
<body data-page="updates"><header id="nav"></header>
<main><div class="wrap" style="padding-top:40px;padding-bottom:50px">
  <div class="sec-h"><small>التحديثات</small><h2>سجل تحديثات Valk</h2><p>الأحدث أولاً. يتولّد من سجل التحديثات داخل البوت نفسه.</p></div>
  <div class="tl" id="tl"></div>
</div></main>
<footer id="foot"></footer>
<script src="js/config.js?v=2.14"></script><script src="js/updates.js?v=2.14"></script><script src="js/app.js?v=2.14"></script>
<script>
(function(){
  var U=(window.VALK_UPDATES||[]).slice().reverse(), tl=document.getElementById("tl");
  function esc(s){return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
  tl.innerHTML=U.length?U.map(function(u){return '<article><h3>'+esc(u.title)+' <small>v'+esc(u.version)+' · '+esc(u.date)+'</small></h3><ul>'+(u.items||[]).map(function(i){return '<li>'+esc(i)+'</li>';}).join("")+'</ul></article>';}).join(""):'<div class="empty">ما اكو تحديثات بعد.</div>';
})();
</script></body></html>
